# Tool configuration only. relevo is not a Python package: there is no [project] table.

[tool.ruff]
line-length = 120
target-version = "py39"
extend-include = ["hooks/*"]
extend-exclude = [".claude", ".venv", ".codeql-shadow"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "RUF"]

# Inherited, protected code (hooks, stats.py): only real errors and undefined names.
[tool.ruff.lint.per-file-ignores]
"hooks/*" = ["E1", "E2", "E3", "E4", "E5", "E7", "W", "B", "I", "UP", "SIM", "RUF"]
"orchestrator/stats.py" = ["E1", "E2", "E3", "E4", "E5", "E7", "W", "B", "I", "UP", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["hooks/*", "orchestrator/stats.py"]

[tool.mypy]
# mypy 2.x refuses to run with python_version below 3.10; real 3.9 compatibility is exercised by the tests
# (CI job test-macos runs them on the system Python 3.9).
python_version = "3.10"
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
