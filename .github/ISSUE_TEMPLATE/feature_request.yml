name: Feature request
description: Suggest an improvement to routing, hooks, the installer, stats or the docs.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. To propose a **new worker agent**, use the "New agent" form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Sketches of commands or output are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including doing nothing or using existing features.
    validations:
      required: false
  - type: dropdown
    id: sensitive
    attributes:
      label: Does it touch security-sensitive paths?
      description: Hooks, permissions, agent tools or models, prompts, the installer, scripts or workflows. See CONTRIBUTING.md, "Security-sensitive changes".
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for duplicates.
          required: true
