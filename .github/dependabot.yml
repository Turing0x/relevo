version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # `prefix: chore` + `include: scope` yields "chore(deps): ..." titles.
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      python-dev-tools:
        patterns:
          - "*"
