name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check docs (table B sync, internal links, schemas, agent sheets)
        run: make docs-check

  # External links are flaky by nature, so this job is informational and is not
  # a required check.
  links:
    name: links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --max-retries 3
            --exclude '^https://github\.com/Turing0x/relevo'
            README.md README.es.md CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md
            GOVERNANCE.md CHANGELOG.md docs .github
